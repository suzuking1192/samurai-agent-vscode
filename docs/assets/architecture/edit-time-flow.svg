<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-label="Samurai Agent edit-time review flow">
  <rect width="960" height="220" fill="#0f172a"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#818cf8"/></marker>
  </defs>
  <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#e2e8f0">
    <rect x="20" y="70" width="150" height="70" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="95" y="100" text-anchor="middle">AI edits code</text>
    <text x="95" y="120" text-anchor="middle" fill="#94a3b8" font-size="12">Cursor / Claude</text>
    <line x1="170" y1="105" x2="210" y2="105" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="210" y="70" width="160" height="70" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="290" y="100" text-anchor="middle">Detect + score</text>
    <text x="290" y="120" text-anchor="middle" fill="#94a3b8" font-size="12">No LLM call</text>
    <line x1="370" y1="105" x2="410" y2="105" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="410" y="70" width="160" height="70" rx="12" fill="#1e293b" stroke="#6366f1"/>
    <text x="490" y="100" text-anchor="middle">IDE warning</text>
    <text x="490" y="120" text-anchor="middle" fill="#94a3b8" font-size="12">One-click review</text>
    <line x1="570" y1="105" x2="610" y2="105" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="610" y="70" width="160" height="70" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="690" y="100" text-anchor="middle">Agent review</text>
    <text x="690" y="120" text-anchor="middle" fill="#94a3b8" font-size="12">Tools + your model</text>
    <line x1="770" y1="105" x2="810" y2="105" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="810" y="70" width="130" height="70" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="875" y="100" text-anchor="middle">Report</text>
    <text x="875" y="120" text-anchor="middle" fill="#94a3b8" font-size="12">BYOK</text>
  </g>
</svg>