name: Bug report
description: Something is broken in the extension
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: "0.4.0"
    validations:
      required: true
  - type: input
    id: ide
    attributes:
      label: IDE
      placeholder: VS Code / Cursor / Windsurf
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact API keys.
